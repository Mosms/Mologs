---
layout: default
---
<section class="intro page-shell">
  <p class="eyebrow">Mosms 的个人博客</p>
  <h1>{{ site.title }}</h1>
  <p class="intro-copy">{{ site.tagline }}。</p>
  <!-- <p class="intro-copy">收录思考、读书与学习笔记，以及值得留下的问题求解过程。</p> -->
  <p class="intro-links"><a href="{{ '/about/' | relative_url }}">About Mologs.</a></p>
</section>

<section class="page-shell latest" aria-labelledby="latest-heading">
  <div class="section-heading">
    <h2 id="latest-heading">最新文章</h2>
    <a href="{{ '/blog/' | relative_url }}">全部文章</a>
  </div>
  <ol class="post-list">
    {% for post in site.posts limit: 8 %}
      {% include post-row.html post=post %}
    {% endfor %}
  </ol>
</section>
