encoding: UTF-8
lang: zh-CN
timezone: Asia/Shanghai

title: Mologs
tagline: "写给生活本身，也写给最初的世界"
description: "Bo Fu 的个人博客：思考、学习笔记与问题求解。"
url: https://mosms.github.io
baseurl: /Mologs
author:
  name: Bo Fu
  email: fubo0970@sjtu.edu.cn
  homepage: https://mosms.github.io/

permalink: /blog/:year/:month/:day/:title/
future: false
show_excerpts: true
code_max_lines: 24

markdown: kramdown
kramdown:
  auto_id_prefix: heading-
  smart_quotes: [apos, apos, quot, quot]
  toc_levels: 1..3
  footnote_nr: 1

plugins:
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

sass:
  style: compressed

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      lang: zh-CN

exclude:
  - .bundle
  - .sass-cache
  - .jekyll-cache
  - .jekyll-metadata
  - Dockerfile
  - compose.yaml
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - "*.gem"
