<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>
(function () {
  try {
    var saved = localStorage.getItem('mologs-theme');
    var theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  } catch (error) {}
}());
</script>
{% seo %}
{% assign asset_version = site.time | date: '%s' %}
<link rel="icon" href="{{ '/assets/images/mologo.png' | relative_url }}">
{% assign document_lang = page.lang | default: site.lang | default: 'en-US' %}
{% if document_lang == 'zh-CN' %}
<link rel="preload" href="{{ '/assets/fonts/liu-gong-quan-profile-v1.woff2' | relative_url }}?v={{ asset_version }}" as="font" type="font/woff2" crossorigin>
{% endif %}
<link rel="stylesheet" href="{{ '/assets/stylesheets/font.css' | relative_url }}?v={{ asset_version }}">
<link rel="stylesheet" href="{{ '/assets/stylesheets/main.css' | relative_url }}?v={{ asset_version }}">
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | absolute_url }}">
{% if page.layout == 'post' %}
<script>
window.MathJax = {
  output: {
    fontPath: "{{ '/assets/mathjax' | relative_url }}"
  },
  tex: {
    inlineMath: [['$', '$'], ['\\(', '\\)']],
    tags: 'ams'
  },
  options: {
    skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
  }
};
</script>
<script defer src="{{ '/assets/mathjax/tex-mml-chtml-mathjax-newcm.js' | relative_url }}?v={{ asset_version }}"></script>
{% endif %}
<script defer src="{{ '/assets/javascripts/cjk-spacing.js' | relative_url }}?v={{ asset_version }}"></script>
<script defer src="{{ '/assets/javascripts/theme-toggle.js' | relative_url }}?v={{ asset_version }}"></script>
<script defer data-max-lines="{{ site.code_max_lines | default: 24 }}" src="{{ '/assets/javascripts/code-blocks.js' | relative_url }}?v={{ asset_version }}"></script>
