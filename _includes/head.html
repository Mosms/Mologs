<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
{% seo %}
{% assign asset_version = site.time | date: '%s' %}
<link rel="icon" href="{{ '/assets/images/mologo.png' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/stylesheets/main.css' | relative_url }}?v={{ asset_version }}">
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | absolute_url }}">
{% if page.layout == 'post' %}
<script>
window.MathJax = {
  output: {
    fontPath: "{{ '/assets/mathjax' | relative_url }}"
  },
  tex: {
    inlineMath: [['$', '$'], ['\\(', '\\)']],
    tags: 'ams'
  },
  options: {
    skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
  }
};
</script>
<script defer src="{{ '/assets/mathjax/tex-mml-chtml-mathjax-newcm.js' | relative_url }}?v={{ asset_version }}"></script>
{% endif %}
<script defer src="{{ '/assets/javascripts/cjk-spacing.js' | relative_url }}?v={{ asset_version }}"></script>
